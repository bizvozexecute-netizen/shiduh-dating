%Header

<div class="breadcrumbs ">
        <div class="breadcrumbs__wrapper wrapper">
          <a class="breadcrumbs__item" href="/" title="">
            <svg class="breadcrumbs__item-icon">
              <use xlink:href="/images/sprite.svg#home"></use>
            </svg> Главная </a>
          <a class="breadcrumbs__item" href="" title="">Контакты</a>
        </div>
      </div>
      
      <section class="contacts">
        <div class="wrapper">
          <div class="page-head contacts__page-head">
            <div class="page-head__title">Контакты</div>
            <button class="contacts__question-btn button" data-hystmodal=".modal--question">Задать вопрос</button>
          </div>
        </div>
        <div class="contacts__body">
          <div class="contacts__body-wrapper wrapper">
            <div class="contacts__main">
              <ul class="contacts__main-list">
                <li class="contacts__main-item contacts__main-item--email">
                  <span class="contacts__main-item-key">Электронная почта</span>
                  <a class="contacts__main-item-val" href="mailto:info@shiduh.org" title="">info@shiduh.org</a>
                </li>
                <li class="contacts__main-item contacts__main-item--tme">
                  <span class="contacts__main-item-key">Наш телеграм канал</span>
                  <a class="contacts__main-item-val" href="https://t.me/shiduh_org" title="">@shiduh_org</a>
                </li>
                <li class="contacts__main-item contacts__main-item--email">
                  <span class="contacts__main-item-key">По вопросам организации мероприятий</span>
                  <a class="contacts__main-item-val" href="mailto:events@shiduh.org" title="">events@shiduh.org</a>
                </li>
                <li class="contacts__main-item contacts__main-item--email">
                  <span class="contacts__main-item-key">СМИ и связи с общественностью</span>
                  <a class="contacts__main-item-val" href="mailto:pr@shiduh.org" title="">pr@shiduh.org</a>
                </li>
                <li class="contacts__main-item contacts__main-item--email">
                  <span class="contacts__main-item-key">Поддержка</span>
                  <a class="contacts__main-item-val" href="mailto:support@shiduh.org" title="">support@shiduh.org</a>
                </li>
                <li class="contacts__main-item contacts__main-item--links">
                  <span class="contacts__main-item-key">Мы в соц.сетях</span>
                  <div class="contacts__main-item-list">
                    <a class="round-icon contacts__main-item-round-icon round-icon--insta" href="https://instagram.com/one.soul.jew" title="">
                      <svg class="round-icon__icon">
                        <use xlink:href="/images/sprite.svg#instagram"></use>
                      </svg>
                    </a>
                    <a class="round-icon contacts__main-item-round-icon round-icon--youtube" href="https://youtube.com/@OneSoulJew" title="">
                      <svg class="round-icon__icon">
                        <use xlink:href="/images/sprite.svg#youtube"></use>
                      </svg>
                    </a>
                    <a class="round-icon contacts__main-item-round-icon round-icon--tme" href="https://t.me/shiduh_org" title="">
                      <svg class="round-icon__icon">
                        <use xlink:href="/images/sprite.svg#tme"></use>
                      </svg>
                    </a>
                  </div>
                </li>
              </ul>
            </div>

              <div class="contacts__composition-item contacts__composition-item--1">

              <div class="contacts__composition-item contacts__composition-item--2">

              </div>
              <div class="contacts__composition-center">
                <picture class="contacts__composition-center-picture">
