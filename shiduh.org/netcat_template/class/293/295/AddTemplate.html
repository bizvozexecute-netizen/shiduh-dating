<script>
const form<?= $AnswerID ? '_answer_'.$AnswerID : '_theme_'.$ThemeID; ?> = document.querySelector('#write_message-new<?= $AnswerID ? '_answer_'.$AnswerID : '_theme_'.$ThemeID; ?>'); // #addForm

  form<?= $AnswerID ? '_answer_'.$AnswerID : '_theme_'.$ThemeID; ?>.addEventListener('submit', (e) => {
      e.preventDefault();
      
      if(!CKEDITOR.instances['f_Message<?= $AnswerID ? '_answer_'.$AnswerID : '_theme_'.$ThemeID; ?>'].getData()) {
          return false;
      }
      document.querySelector('#f_Message<?= $AnswerID ? '_answer_'.$AnswerID : '_theme_'.$ThemeID; ?>').value = CKEDITOR.instances['f_Message<?= $AnswerID ? '_answer_'.$AnswerID : '_theme_'.$ThemeID; ?>'].getData();
      
      // Собираем данные формы
      const formData = new FormData(form<?= $AnswerID ? '_answer_'.$AnswerID : '_theme_'.$ThemeID; ?>);

      /* eslint-disable indent */
      fetch(form<?= $AnswerID ? '_answer_'.$AnswerID : '_theme_'.$ThemeID; ?>.action, {
        method: 'POST',
        body: formData,
      })
      .then((response) => {
        if (!response.ok) {
          throw new Error(`Ошибка ${response.status}`);
        }
        // В случае успешной отправки, выполняем перезагрузку страницы
        window.location.reload();
      })
      .catch((error) => {
        // Обработка ошибок, если есть
        console.error('Произошла ошибка:', error);
      });
      /* eslint-enable indent */
    });    


</script>
