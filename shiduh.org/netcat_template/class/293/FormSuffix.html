  <script>
[...document.querySelectorAll('.comment__date')].forEach(el => {
    var date = new Date(el.getAttribute('data-time').replace(/-/g, "/"));
    el.innerHTML = `${("0" + date.getDate()).slice(-2)}.${("0" + (date.getMonth() + 1)).slice(-2)}.${date.getFullYear()} - ${("0" + date.getHours()).slice(-2)}:${("0" + date.getMinutes()).slice(-2)}`;
    //el.innerHTML = date;
});

</script>
