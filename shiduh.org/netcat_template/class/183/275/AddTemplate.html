<script>
const form = document.querySelector('#adminForm'); // #addForm
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      if (!CKEDITOR.instances['f_newsSubTitle'].getData() || !CKEDITOR.instances['f_text'].getData()) {
        e.stopImmediatePropagation(); // останавливает form.js
        return;
      }

      document.querySelector('#f_newsSubTitle').value = CKEDITOR.instances['f_newsSubTitle'].getData();
      document.querySelector('#f_text').value = CKEDITOR.instances['f_text'].getData();
    });
  }
</script>
