<script>
const form = document.querySelector('#write_message-new'); // #addForm
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      if(!CKEDITOR.instances['f_Message'].getData()) {
          return false;
      }
      document.querySelector('#f_Message').value = CKEDITOR.instances['f_Message'].getData();
      
      // Собираем данные формы
      const formData = new FormData(form);

      /* eslint-disable indent */
      fetch(form.action, {
        method: 'POST',
        body: formData,
      })
      .then((response) => {
        if (!response.ok) {
          throw new Error(`Ошибка ${response.status}`);
        }
        // В случае успешной отправки, выполняем перезагрузку страницы
        window.location.href = '<?= $subLink;?>';
      })
      .catch((error) => {
        // Обработка ошибок, если есть
        console.error('Произошла ошибка:', error);
      });
      /* eslint-enable indent */
    });
  }
</script>
