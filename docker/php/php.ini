; Настройки PHP для локальной копии shiduh.org (NetCat 6.2.0).
; Монтируется в /usr/local/etc/php/conf.d/ — грузится после php.ini-*.

; ---------------------------------------------------------------------------
; ОБЯЗАТЕЛЬНО. Без этого netcat/connect_io.php печатает
; "short_open_tag value must be on!" и завершает работу.
; Кодовая база использует <? и <?= более 6000 раз.
; .htaccess проекта включает это только для mod_php через <IfModule>,
; но полагаться на это нельзя.
; ---------------------------------------------------------------------------
short_open_tag = On

; ---------------------------------------------------------------------------
; Ошибки. На проде display_errors выключен (.htaccess), локально — наоборот:
; нам нужно видеть, что ломается. E_NOTICE/E_DEPRECATED заглушены, иначе
; legacy-код зальёт экран (vars.inc.php:12 делает то же самое).
; ---------------------------------------------------------------------------
display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED
log_errors = On
error_log = /dev/stderr

; ---------------------------------------------------------------------------
; Ресурсы. 256M — рекомендация netcat/admin/report/function.inc.php:104
; (+64M если включён модуль search).
; ---------------------------------------------------------------------------
memory_limit = 256M
max_execution_time = 120
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 50

; ---------------------------------------------------------------------------
; Почта. Страховка от прямых вызовов mail(): всё в mailpit.
; ---------------------------------------------------------------------------
sendmail_path = "/usr/bin/msmtp -t -i"

; ---------------------------------------------------------------------------
; Кодировки
; ---------------------------------------------------------------------------
default_charset = "UTF-8"
mbstring.internal_encoding = UTF-8

; ---------------------------------------------------------------------------
; Сессии: NetCat сам вызывает session_start() в netcat/system/index.php:34
; ---------------------------------------------------------------------------
session.auto_start = 0
session.save_handler = files
session.gc_maxlifetime = 2592000

; ---------------------------------------------------------------------------
; OPcache. Критично для производительности: webroot смонтирован с диска
; Windows через WSL2, и stat каждого файла стоит дорого. revalidate_freq=2
; оставляет разработку удобной — правки шаблонов подхватываются за 2 секунды.
; НЕ ставить validate_timestamps=0: правки .html-шаблонов перестанут
; применяться без перезапуска контейнера.
; ---------------------------------------------------------------------------
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1

date.timezone = Europe/Moscow
